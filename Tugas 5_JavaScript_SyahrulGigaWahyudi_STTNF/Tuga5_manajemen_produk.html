<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 5 - Manajemen Produk Toko Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
        }
        h2 {
            text-align: center;
            color: #1a5276;
        }
        .form-box {
            max-width: 500px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .form-box label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        .form-box input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        .form-box button {
            margin-top: 15px;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background-color: #1a5276;
            color: white;
            cursor: pointer;
            margin-right: 8px;
        }
        .form-box button:hover {
            background-color: #154360;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px 14px;
            text-align: left;
        }
        thead {
            background-color: #1a5276;
            color: white;
        }
        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h2>Manajemen Produk Toko Online</h2>

    <!-- ===== Form Tambah Produk ===== -->
    <div class="form-box">
        <h3>Tambah Produk</h3>
        <label for="inputId">ID Produk</label>
        <input type="number" id="inputId" placeholder="Contoh: 6">

        <label for="inputNama">Nama Produk</label>
        <input type="text" id="inputNama" placeholder="Contoh: Headset">

        <label for="inputHarga">Harga Produk</label>
        <input type="number" id="inputHarga" placeholder="Contoh: 500000">

        <button id="btnTambah">Tambah Produk</button>
    </div>

    <!-- ===== Form Hapus Produk ===== -->
    <div class="form-box">
        <h3>Hapus Produk</h3>
        <label for="inputHapusId">ID Produk yang ingin dihapus (pisahkan dengan koma jika lebih dari satu)</label>
        <input type="text" id="inputHapusId" placeholder="Contoh: 2,4">

        <button id="btnHapus">Hapus Produk</button>
        <button id="btnTampilkan">Tampilkan Semua Produk</button>
    </div>

    <!-- ===== Tabel Produk ===== -->
    <div id="tabelProduk"></div>

    <script>
        /* DATA PRODUK AWAL (minimal 5)*/
        let produkList = [
            { id: 1, nama: "Laptop", harga: 12000000 },
            { id: 2, nama: "Smartphone", harga: 5000000 },
            { id: 3, nama: "Tablet", harga: 7000000 },
            { id: 4, nama: "Mouse", harga: 200000 },
            { id: 5, nama: "Keyboard", harga: 350000 }
        ];

        /* MENAMBAHKAN PRODUK (Spread Operator)*/
        function tambahProduk(id, nama, harga) {
            const produkBaru = { id, nama, harga };
            // Spread operator untuk menambahkan produk baru ke array
            // tanpa mengubah array aslinya secara langsung (immutability)
            produkList = [...produkList, produkBaru];
            console.log(`Produk "${nama}" berhasil ditambahkan dengan id ${id}`);
        }

        /*  MENGHAPUS PRODUK (Rest Parameter)
           Bisa menghapus lebih dari satu id sekaligus, contoh:
           hapusProduk(2, 4) atau hapusProduk(2) */
        function hapusProduk(...idYangDihapus) {
            const jumlahSebelum = produkList.length;

            produkList = produkList.filter(produk => !idYangDihapus.includes(produk.id));

            const jumlahDihapus = jumlahSebelum - produkList.length;
            console.log(`${jumlahDihapus} produk dengan id [${idYangDihapus.join(", ")}] berhasil dihapus`);
        }

        /* MENAMPILKAN PRODUK (Destructuring)*/
        function tampilkanProduk() {
            console.log("===== Daftar Produk Saat Ini =====");

            if (produkList.length === 0) {
                console.log("Tidak ada produk yang tersedia.");
            } else {
                produkList.forEach(produk => {
                    // Destructuring object untuk mengambil nilai id, nama, harga
                    const { id, nama, harga } = produk;
                    console.log(`ID: ${id} | Nama: ${nama} | Harga: Rp${harga.toLocaleString("id-ID")}`);
                });
            }

            console.log("===================================");

            // Render ke tampilan web (tabel HTML)
            renderTabel();
        }

        /* RENDER TABEL KE HALAMAN WEB*/
        function renderTabel() {
            let baris = "";

            produkList.forEach(produk => {
                const { id, nama, harga } = produk;
                baris += `
                    <tr>
                        <td>${id}</td>
                        <td>${nama}</td>
                        <td>Rp${harga.toLocaleString("id-ID")}</td>
                    </tr>
                `;
            });

            document.getElementById("tabelProduk").innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Produk</th>
                            <th>Harga</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${baris || `<tr><td colspan="3">Tidak ada produk</td></tr>`}
                    </tbody>
                </table>
            `;
        }

        /* EVENT HANDLER (kumpulan fungsi penanganan event)*/
        const eventHandler = {
            onTambah: function () {
                const id = Number(document.getElementById("inputId").value);
                const nama = document.getElementById("inputNama").value.trim();
                const harga = Number(document.getElementById("inputHarga").value);

                if (!id || !nama || !harga) {
                    alert("Mohon isi semua field (ID, Nama, Harga) dengan benar.");
                    return;
                }

                tambahProduk(id, nama, harga);
                tampilkanProduk();

                // Reset form setelah submit
                document.getElementById("inputId").value = "";
                document.getElementById("inputNama").value = "";
                document.getElementById("inputHarga").value = "";
            },

            onHapus: function () {
                const inputValue = document.getElementById("inputHapusId").value.trim();

                if (!inputValue) {
                    alert("Mohon isi ID produk yang ingin dihapus.");
                    return;
                }

                // Mengubah input "2,4" menjadi array angka [2, 4]
                const idArray = inputValue.split(",").map(id => Number(id.trim()));

                // Rest parameter dipanggil menggunakan spread saat pemanggilan fungsi
                hapusProduk(...idArray);
                tampilkanProduk();

                document.getElementById("inputHapusId").value = "";
            },

            onTampilkan: function () {
                tampilkanProduk();
            }
        };

        /* EVENT LISTENER - menghubungkan tombol dengan eventHandler  */
        document.getElementById("btnTambah").addEventListener("click", eventHandler.onTambah);
        document.getElementById("btnHapus").addEventListener("click", eventHandler.onHapus);
        document.getElementById("btnTampilkan").addEventListener("click", eventHandler.onTampilkan);

        /*TESTING AWAL (sesuai contoh di soal)*/
        tampilkanProduk();
        // contoh penambahan data
        tambahProduk(6, "Headset", 450000);
        tampilkanProduk();
        hapusProduk(2);
        tampilkanProduk();
    </script>

</body>
</html>
